name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: pyinstaller --noconfirm --onefile --windowed --name VidsDownloadTool --collect-all imageio_ffmpeg --collect-all yt_dlp --collect-all yt_dlp_ejs app.py
      - uses: actions/upload-artifact@v4
        with:
          name: VidsDownloadTool-windows
          path: dist/VidsDownloadTool.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VidsDownloadTool.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: PYTHON=python bash build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: VidsDownloadTool-macos
          path: dist/VidsDownloadTool.dmg
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VidsDownloadTool.dmg
